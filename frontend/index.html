<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ad Display — DSS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="zone-grid">
    <div class="zone zone-half">
      <div class="zone-content" id="zone-gif-content"><div class="fallback">Loading...</div></div>
      <div class="zone-label" id="zone-gif-label">GIF ZONE</div>
    </div>
    <div class="zone zone-quarter zone-top-right">
      <div class="zone-content" id="zone-image-content"><div class="fallback">Loading...</div></div>
      <div class="zone-label" id="zone-image-label">IMAGE ZONE</div>
    </div>
    <div class="zone zone-quarter zone-bottom-right">
      <div class="zone-content" id="zone-video-content"><div class="fallback">Loading...</div></div>
      <div class="zone-label" id="zone-video-label">VIDEO ZONE</div>
    </div>
  </div>

  <div class="timeline-wrapper">
    <div class="timeline-track" id="timeline-track"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/preloader.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
